# ============================================================
# Agent Factory 默认配置
# 本文件定义 Agent Factory 生成多 Agent 系统时的全局默认参数。
# AI Coding Agent 读取本文件后，按照此处约束执行系统生成流程。
# 所有字段均可被项目级 config 或用户输入覆盖。
# ============================================================

# ----------------------------------------------------------
# 默认运行模式
#   fast     — 快速模式：牺牲质量换取速度，适合原型/草稿
#   standard — 标准模式：质量与速度平衡（默认推荐）
#   strict   — 严格模式：最大化质量，多轮审核，适合正式交付
# ----------------------------------------------------------
default_mode: standard

# ----------------------------------------------------------
# 预算限制
# 控制 Agent 数量、并行度、重试、上下文窗口等硬性上限。
# 超出上限时触发降级策略（见 degradation 段）。
# ----------------------------------------------------------
budget:
  max_agents: 12                    # 单个系统最多生成的 Agent 数量
  max_parallel_agents: 6            # 同时运行的最大 Agent 数量
  max_retries_per_task: 2           # 单个任务最大重试次数（不含首次执行）
  max_context_chars_per_task: 30000 # 单个任务上下文字符数上限（超出则裁剪或分块）
  max_review_rounds: 1              # 最大审核轮次（strict 模式可提升至 2-3）
  prefer_cache: true                # 优先复用已通过验证的中间结果

# ----------------------------------------------------------
# 并行控制
# 基于 DAG 的任务调度策略，最大化并行同时保证数据一致性。
# ----------------------------------------------------------
parallel:
  max_concurrency: 4                # 最大并发数（建议 4-6，根据宿主机性能调整）
  single_writer_per_file: true      # 同一文件同一时间仅允许一个 Agent 写入（写锁）
  orchestrator_only_for_summary: true # 编排器（Orchestrator）仅负责汇总，不执行具体子任务

# ----------------------------------------------------------
# 记忆系统
# 五层记忆体系：用户偏好 / 情景 / 语义 / 程序性 / 评估
# 受控进化：新记忆不自动启用，须经审批流程。
# ----------------------------------------------------------
memory:
  enable_long_term: true            # 启用长期记忆（跨会话持久化）
  auto_approve_candidates: false    # 候选记忆是否自动批准（false = 需人工/流程审批）
  max_memory_items: 1000            # 每层记忆最大条目数（超出触发淘汰策略）

# ----------------------------------------------------------
# 深度思考补偿
# 为推理能力较弱的模型提供"思考脚手架"与自我验证机制。
# ----------------------------------------------------------
deep_thinking:
  max_token_ratio: 0.30             # 深度思考可消耗的最大 Token 占比（相对总预算）
  max_iterations: 2                 # 自我验证最大迭代次数
  cache_passed_steps: true          # 缓存已通过验证的推理步骤，避免重复计算

# ----------------------------------------------------------
# 质量控制
# 结构检查始终执行；语义审核按模式分级；冲突严格解决。
# ----------------------------------------------------------
quality:
  structure_check: always           # 结构检查：always（始终执行）
  semantic_review: standard         # 语义审核：standard（标准）/ strict（严格）
  conflict_resolution: strict       # 冲突解决：strict（严格，发现冲突必须解决）

# ----------------------------------------------------------
# 安全策略
# 最小权限原则 + 提示注入防护 + 高风险人工确认。
# ----------------------------------------------------------
safety:
  min_privilege: true               # 最小权限：每个 Agent 仅获得完成任务所需的最小权限
  prompt_injection_protection: true # 提示注入防护：对用户输入和外部数据做注入检测
  human_confirm_high_risk: true     # 高风险操作（删除文件、网络请求等）需人工确认

# ----------------------------------------------------------
# 降级策略（Level 1 → Level 6，逐级触发）
# 当资源不足或质量下降时，按级别启用降级措施。
# ----------------------------------------------------------
degradation:
  # Level 1：减少并行度，降低资源占用
  level_1:
    trigger: "并发 Agent 数接近上限"
    action: "max_concurrency 降至 2，排队执行剩余任务"

  # Level 2：关闭非关键 Agent，保留核心链路
  level_2:
    trigger: "Agent 总数接近 max_agents"
    action: "跳过可选 Agent（如 fact_checker），仅保留 planner → writer → reviewer 主链"

  # Level 3：跳过深度思考，改用单步直接输出
  level_3:
    trigger: "Token 消耗接近预算阈值"
    action: "关闭 deep_thinking 迭代，max_iterations 降至 0，直接输出首轮结果"

  # Level 4：合并任务，减少 Agent 数量
  level_4:
    trigger: "上下文窗口持续不足"
    action: "将相邻可合并任务合并为单个 Agent 处理（如 researcher + writer 合并）"

  # Level 5：分块处理，将大任务拆为多次小批次
  level_5:
    trigger: "单任务上下文超出 max_context_chars_per_task"
    action: "启动分块策略，每块独立处理，最后合并结果"

  # Level 6：降级为单 Agent 串行模式，保证可完成
  level_6:
    trigger: "系统资源严重不足或反复失败"
    action: "退化为单 Agent 串行执行，跳过所有并行与审核，仅保证输出完整性"
