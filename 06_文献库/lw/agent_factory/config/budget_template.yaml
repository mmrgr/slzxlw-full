# ============================================================
# Agent Factory 预算模板
# 为三种运行模式提供 Token / Agent 预算配置示例。
# 用户可基于 custom 模板自定义预算。
# ============================================================

# ----------------------------------------------------------
# 预算模式说明
#   fast     — 快速：少 Agent、低重试、无深度思考，适合原型
#   standard — 标准：平衡配置，适合大多数场景（默认）
#   strict   — 严格：多审核、高重试、深度思考迭代，适合正式交付
# ----------------------------------------------------------

modes:

  # ============================================================
  # 快速模式
  # 目标：最快出结果，牺牲质量保证速度
  # 适用：原型验证、草稿生成、快速预览
  # ============================================================
  fast:
    max_agents: 4                     # 最多 4 个 Agent
    max_parallel: 3                   # 最多 3 个并行
    max_retries: 1                    # 最多重试 1 次
    max_context_chars: 20000          # 单任务上下文 20000 字符
    max_review_rounds: 0              # 不做审核轮次
    max_deep_thinking_iterations: 0   # 不做深度思考迭代
    token_budget_estimate: 50000      # 预估总 Token 预算约 5 万

  # ============================================================
  # 标准模式（默认推荐）
  # 目标：质量与速度平衡
  # 适用：大多数日常任务
  # ============================================================
  standard:
    max_agents: 8                     # 最多 8 个 Agent
    max_parallel: 5                   # 最多 5 个并行
    max_retries: 2                    # 最多重试 2 次
    max_context_chars: 30000          # 单任务上下文 30000 字符
    max_review_rounds: 1              # 1 轮审核
    max_deep_thinking_iterations: 2   # 深度思考最多 2 次迭代
    token_budget_estimate: 150000     # 预估总 Token 预算约 15 万

  # ============================================================
  # 严格模式
  # 目标：最大化质量，多轮审核
  # 适用：正式交付、学术翻译、高精度分析
  # ============================================================
  strict:
    max_agents: 12                    # 最多 12 个 Agent
    max_parallel: 6                   # 最多 6 个并行
    max_retries: 3                    # 最多重试 3 次
    max_context_chars: 50000          # 单任务上下文 50000 字符
    max_review_rounds: 3              # 3 轮审核
    max_deep_thinking_iterations: 4   # 深度思考最多 4 次迭代
    token_budget_estimate: 400000     # 预估总 Token 预算约 40 万

# ============================================================
# 自定义预算模板
# 用户可复制此段并按需修改，覆盖上述预设模式。
# 所有字段均可省略，省略时回退到 standard 模式默认值。
# ============================================================
custom:
  # mode_base: standard              # 基于哪个模式进行自定义（可选）
  max_agents: 8                       # 最多 Agent 数量
  max_parallel: 4                     # 最多并行数
  max_retries: 2                      # 最多重试次数
  max_context_chars: 30000            # 单任务上下文字符上限
  max_review_rounds: 1                # 审核轮次
  max_deep_thinking_iterations: 2     # 深度思考迭代次数
  token_budget_estimate: 150000       # 预估总 Token 预算
  # --- 可选的高级覆盖字段 ---
  # prefer_cache: true                # 是否优先缓存
  # single_writer_per_file: true      # 单文件单写者锁
  # auto_approve_candidates: false    # 记忆自动审批
